meta: {version: PLCN_v3}
name: Golang
uuid: a174a67d-5ba3-4d7e-a9fb-c09981c60d15
author: cshubb
description: Build and run a Go package on startup, with optional GitHub pulls. Go installs automatically.
tags: [golang]
features: []
docker_images:
  Debian: ghcr.io/pelican-eggs/yolks:debian
file_denylist: []
startup_commands:
  Default: >-
    set -euo pipefail;
    fail() { echo "[golang] ERROR: $*" >&2; exit 1; };
    normalize_repository() {
        local repository="${1#https://github.com/}";
        repository="${repository%/}";
        repository="${repository%.git}";
        [[ "$repository" =~ ^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+$ ]] || return 1;
        echo "$repository";
    };
    cd "${HOME:-/home/container}";
    root="$(pwd -P)";
    executable="${EXECUTABLE:-}";
    package="${GO_PACKAGE:-}";
    pull_on_startup="${PULL_ON_STARTUP:-0}";
    export PATH="$root/.pelican/go/bin:$PATH";
    [[ "$executable" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || fail 'Invalid EXECUTABLE filename.';
    [[ -n "$package" && "${package:0:1}" != / ]] || fail 'GO_PACKAGE must be relative to the server files root.';
    [[ "$pull_on_startup" == 0 || "$pull_on_startup" == 1 ]] || fail 'PULL_ON_STARTUP must be 0 or 1.';
    if [[ "$pull_on_startup" == 1 && -n "${GITHUB_REPO:-}" ]]; then
        repository="$(normalize_repository "$GITHUB_REPO")" || fail 'GITHUB_REPO must be owner/repo or a GitHub HTTPS URL.';
        repository_url="https://github.com/${repository}.git";
        export GIT_TERMINAL_PROMPT=0 LC_ALL=C GIT_ASKPASS="$root/.pelican/git-askpass.sh";
        if [[ -e .git ]]; then
            [[ "$(git rev-parse --show-toplevel)" == "$root" ]] || fail 'Git working tree must be rooted here.';
            origin="$(git remote get-url origin)";
            [[ "$origin" == https://github.com/* ]] && origin_repository="$(normalize_repository "$origin")" ||
                fail 'The origin remote must be a GitHub HTTPS URL without credentials.';
            [[ "${origin_repository,,}" == "${repository,,}" ]] || fail 'GITHUB_REPO differs from origin.';
            git symbolic-ref --quiet HEAD >/dev/null || fail 'Cannot pull a detached HEAD.';
            echo '[golang] Pulling repository (fast-forward only)...';
            git -c credential.helper= pull --ff-only --no-rebase origin;
        else
            [[ -z "$(find . -mindepth 1 -maxdepth 1 ! -name .pelican -print -quit)" ]] ||
                fail 'Initial clone requires an empty server files root (apart from .pelican).';
            mkdir -p "$root/.pelican";
            clone_directory="$(mktemp -d "$root/.pelican/clone.XXXXXX")";
            trap 'rm -rf -- "$clone_directory"' EXIT;
            echo '[golang] Cloning repository...';
            git -c credential.helper= clone -- "$repository_url" "$clone_directory";
            [[ ! -e "$clone_directory/.pelican" && ! -L "$clone_directory/.pelican" ]] ||
                fail 'Repository must not contain .pelican (reserved for Go).';
            shopt -s dotglob;
            mv -- "$clone_directory"/* "$root/";
            rmdir "$clone_directory";
            trap - EXIT;
        fi;
    fi;
    unset GITHUB_TOKEN GIT_ASKPASS GIT_TERMINAL_PROMPT STARTUP;
    [[ -d "$root/$package" ]] || fail 'GO_PACKAGE does not exist or is not a directory.';
    package_directory="$(cd "$root/$package" && pwd -P)";
    [[ "$package_directory" == "$root" || "$package_directory" == "$root/"* ]] || fail 'GO_PACKAGE must resolve inside the server root.';
    [[ ! -d "$root/$executable" ]] || fail 'EXECUTABLE conflicts with an existing directory.';
    export GOPATH="$root/.cache/go" GOCACHE="$root/.cache/go-build";
    mkdir -p "$GOPATH" "$GOCACHE";
    go version;
    echo "[golang] Building $package -> $executable...";
    build_directory="$(mktemp -d "$root/.go-build.XXXXXX")";
    trap 'rm -rf -- "$build_directory"' EXIT;
    (cd "$package_directory"; GOTMPDIR="$build_directory" TMPDIR="$build_directory" go build -o "$build_directory/app" .);
    [[ -f "$build_directory/app" && -x "$build_directory/app" ]] || fail 'GO_PACKAGE must build an executable main package.';
    mv -fT -- "$build_directory/app" "$root/$executable";
    rmdir "$build_directory";
    trap - EXIT;
    echo '[golang] Launching application';
    exec "$root/$executable"
config:
  files: {}
  startup: {done: '[golang] Launching application'}
  logs: {}
  stop: '^C'
scripts:
  installation:
    container: ghcr.io/pelican-eggs/installers:debian
    entrypoint: bash
    script: |-
      #!/bin/bash
      set -euo pipefail
      tools=/mnt/server/.pelican
      mkdir -p "$tools"
      case "$(uname -m)" in
          x86_64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo 'Unsupported CPU architecture.' >&2; exit 1 ;;
      esac
      release="$(curl -fsSL --retry 3 'https://go.dev/dl/?mode=json' | jq -er --arg arch "$arch" '
          [.[] | select(.stable) | .files[] |
           select(.os == "linux" and .arch == $arch and .kind == "archive")][0] |
          select(. != null) | [.filename, .sha256] | @tsv')"
      read -r filename checksum <<< "$release"
      download_directory="$(mktemp -d "$tools/.download.XXXXXX")"
      trap 'rm -rf -- "$download_directory"' EXIT
      curl -fsSL --retry 3 "https://go.dev/dl/$filename" -o "$download_directory/go.tar.gz"
      printf '%s  %s\n' "$checksum" "$download_directory/go.tar.gz" | sha256sum -c -
      tar -xzf "$download_directory/go.tar.gz" -C "$download_directory"
      rm -rf -- "$tools/go"
      mv -- "$download_directory/go" "$tools/go"

      cat > "$tools/git-askpass.sh" <<'ASKPASS_SH'
      #!/bin/bash
      set -euo pipefail
      case "${1:-}" in
          *Username*) echo x-access-token ;;
          *Password*) [[ -n "${GITHUB_TOKEN:-}" ]] && printf '%s\n' "$GITHUB_TOKEN" ;;
          *) exit 1 ;;
      esac
      ASKPASS_SH
      chmod 755 "$tools/git-askpass.sh"
      echo 'Go installed. Source files will be built at startup.'
variables:
  - sort: 1
    name: Executable name
    description: Output filename in the server root, without a path.
    env_variable: EXECUTABLE
    default_value: server
    user_viewable: true
    user_editable: true
    rules: [required, string, 'max:128', 'regex:/^[A-Za-z0-9][A-Za-z0-9._-]*$/']
  - sort: 2
    name: Go package directory
    description: 'Main-package directory relative to the server root, e.g. . or ./cmd/api.'
    env_variable: GO_PACKAGE
    default_value: '.'
    user_viewable: true
    user_editable: true
    rules: [required, string, 'max:255']
  - sort: 3
    name: GitHub repository
    description: 'Optional owner/repo or HTTPS GitHub URL. First clone needs an empty server root except .pelican.'
    env_variable: GITHUB_REPO
    default_value: ''
    user_viewable: true
    user_editable: true
    rules: [nullable, string, 'max:255', 'regex:~^(https://github\.com/)?[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+/?$~']
  - sort: 4
    name: GitHub token
    description: Optional read-only PAT for private repositories. Admin-only field; not isolated from server code.
    env_variable: GITHUB_TOKEN
    default_value: ''
    user_viewable: false
    user_editable: false
    rules: [nullable, string, 'max:512']
  - sort: 5
    name: Pull on startup
    description: Clone or fast-forward pull before building when a repository is set.
    env_variable: PULL_ON_STARTUP
    default_value: '0'
    user_viewable: true
    user_editable: true
    rules: [required, boolean]
