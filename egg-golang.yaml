meta: {version: PLCN_v3}
name: Golang
uuid: a174a67d-5ba3-4d7e-a9fb-c09981c60d15
author: cshubb
description: Build and run a Go package on startup, with optional GitHub pulls. Go installs automatically.
tags: [golang]
features: []
docker_images:
  Debian: ghcr.io/pelican-eggs/yolks:debian
file_denylist: []
startup_commands:
  Default: 'exec bash /home/container/.pelican/start.sh'
config:
  files: {}
  startup: {done: '[golang] Launching application'}
  logs: {}
  stop: '^C'
scripts:
  installation:
    container: ghcr.io/pelican-eggs/installers:debian
    entrypoint: bash
    script: |-
      #!/bin/bash
      set -euo pipefail
      cd /mnt/server
      rm -rf .pelican

      if [[ -n "${GITHUB_REPO:-}" && ! -d .git ]]; then
          repo="${GITHUB_REPO#https://github.com/}"
          [[ "${repo%/}" =~ ^([^/]+/[^/]+)(/tree/(.+))?$ ]]
          repo="${BASH_REMATCH[1]%.git}" branch="${BASH_REMATCH[3]}"
          auth=()
          [[ -z "${GITHUB_TOKEN:-}" ]] || auth=(-c "http.https://github.com/.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)")
          echo "Cloning $repo..."
          git "${auth[@]}" clone ${branch:+--branch "$branch"} "https://github.com/$repo.git" .
      fi

      mkdir .pelican
      version="$(curl -fsSL 'https://go.dev/VERSION?m=text' | sed -n 1p)"
      echo "Installing $version..."
      curl -fsSL "https://go.dev/dl/$version.linux-$(dpkg --print-architecture).tar.gz" | tar -xz -C .pelican

      cat > .pelican/start.sh <<'START_SH'
      #!/bin/bash
      set -euo pipefail
      cd /home/container
      export PATH="$PWD/.pelican/go/bin:$PATH" GIT_TERMINAL_PROMPT=0

      if [[ "${PULL_ON_STARTUP:-0}" == 1 && -n "${GITHUB_REPO:-}" ]]; then
          [[ -d .git ]] || { echo '[golang] ERROR: No Git repository; reinstall to clone GITHUB_REPO.' >&2; exit 1; }
          repo="${GITHUB_REPO#https://github.com/}"
          [[ "${repo%/}" =~ ^([^/]+/[^/]+)(/tree/(.+))?$ ]]
          branch="${BASH_REMATCH[3]}"
          auth=()
          [[ -z "${GITHUB_TOKEN:-}" ]] || auth=(-c "http.https://github.com/.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)")
          echo '[golang] Pulling repository...'
          git "${auth[@]}" fetch origin
          [[ -z "$branch" ]] || git switch -q "$branch"
          git merge --ff-only '@{upstream}'
      fi
      unset GITHUB_TOKEN

      export GOPATH="$PWD/.cache/go"
      go version
      echo "[golang] Building $GO_PACKAGE -> $EXECUTABLE..."
      # Keep compiler intermediates off Wings' small /tmp tmpfs.
      tmp="$PWD/.cache/tmp"
      mkdir -p "$tmp"
      GOTMPDIR="$tmp" TMPDIR="$tmp" go build -C "$GO_PACKAGE" -o "$PWD/$EXECUTABLE" .
      echo '[golang] Launching application'
      exec "./$EXECUTABLE"
      START_SH
      chmod 755 .pelican/start.sh
      echo 'Go installed. Source files will be built at startup.'
variables:
  - sort: 1
    name: Executable name
    description: Output filename in the server root, without a path.
    env_variable: EXECUTABLE
    default_value: server
    user_viewable: true
    user_editable: true
    rules: [required, string, 'max:128', 'regex:/^[A-Za-z0-9][A-Za-z0-9._-]*$/']
  - sort: 2
    name: Go package directory
    description: 'Main-package directory relative to the server root, e.g. . or ./cmd/api.'
    env_variable: GO_PACKAGE
    default_value: '.'
    user_viewable: true
    user_editable: true
    rules: [required, string, 'max:255']
  - sort: 3
    name: GitHub repository
    description: 'Optional owner/repo or GitHub URL; /tree/branch selects a branch. Cloned on install into an empty server.'
    env_variable: GITHUB_REPO
    default_value: ''
    user_viewable: true
    user_editable: true
    rules: [nullable, string, 'max:255', 'regex:~^(https://github\.com/)?[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+(/tree/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*)?/?$~']
  - sort: 4
    name: GitHub token
    description: Optional read-only PAT for private repositories. Admin-only field; not isolated from server code.
    env_variable: GITHUB_TOKEN
    default_value: ''
    user_viewable: false
    user_editable: false
    rules: [nullable, string, 'max:512']
  - sort: 5
    name: Pull on startup
    description: Fast-forward pull (switching to the URL's branch) before building.
    env_variable: PULL_ON_STARTUP
    default_value: '0'
    user_viewable: true
    user_editable: true
    rules: [required, boolean]
